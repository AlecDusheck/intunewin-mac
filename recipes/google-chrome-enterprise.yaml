id: google-chrome-enterprise
name: Google Chrome Enterprise
publisher: Google LLC
description: Google Chrome browser, enterprise MSI (standalone/offline installer).
homepage: https://chromeenterprise.google/browser/download/
sources:
  x64:
    url: https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi
  arm64:
    url: https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise_arm64.msi
version: auto                      # from MSI ProductVersion
install: 'msiexec /i "{filename}" /qn /norestart'
uninstall: 'msiexec /x {product_code} /qn /norestart'
install_context: system
restart_behavior: basedOnReturnCode
detection: auto                    # MSI product code rule
requirements:
  arch: [x64, arm64]
  min_os: W10_1607
